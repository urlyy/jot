name: 打包发布

# 触发方式：
#   1) 推一个 v* 标签（推荐，见 scripts/release.ps1）
#   2) 手动触发，填入要发布的 tag
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # 先跑一遍测试，挂了就不发布，避免把坏包发出去
  verify:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 校验 tag 与版本号一致
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml)
          if [ "$VERSION" != "$PACKAGE_VERSION" ] || [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tauri.conf.json、package.json 与 Cargo.toml 的版本号必须一致"
            exit 1
          fi
          TAG="$RELEASE_TAG"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::tag 是 $TAG，但 src-tauri/tauri.conf.json 里是 $VERSION；请先改版本号再打 tag"
            exit 1
          fi
          echo "版本一致：$TAG"

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run lint

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 系统依赖（cargo test 需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev \
            libxdo-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 后端单元测试
        working-directory: src-tauri
        run: cargo test --lib

  release:
    name: 打包（${{ matrix.platform }}）
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundle: src-tauri/target/release/bundle
            extensions: msi
          - os: macos-latest
            platform: macos
            args: --target universal-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
            extensions: dmg
          - os: ubuntu-22.04
            platform: linux
            bundle: src-tauri/target/release/bundle
            extensions: deb AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 macOS 双架构 target
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 构建安装包
        run: npm run tauri build -- --ci ${{ matrix.args }}

      - name: 收集安装包
        shell: bash
        run: |
          mkdir installer-assets
          bundle="${{ matrix.bundle }}"
          for extension in ${{ matrix.extensions }}; do
            directory=$(printf "%s" "$extension" | tr "[:upper:]" "[:lower:]")
            files=("$bundle/$directory/"*."$extension")
            if [[ ! -f "${files[0]}" ]]; then
              echo "::error::缺少 .$extension 安装包"
              exit 1
            fi
            cp "${files[@]}" installer-assets/
          done

      - uses: actions/upload-artifact@v4
        with:
          name: jot-${{ matrix.platform }}
          path: installer-assets/
          if-no-files-found: error
          overwrite: true

  publish:
    name: 发布 GitHub Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jot-*
          path: installer-assets
          merge-multiple: true

      - name: 上传安装包
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" installer-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" installer-assets/* --verify-tag \
              --title "Jot $RELEASE_TAG" \
              --notes "Windows 下载 .msi，macOS 下载 .dmg，Linux 下载 .AppImage 或 .deb。"
          fi
